# This file is used by the Thunderstore CLI to build and publish to Thunderstore. https://github.com/thunderstore-io/thunderstore-cli

[config]
schemaVersion = "0.0.1"

[package]
namespace = "eia485"
name = "GetItemLink"
description = "adds buttons to your inventory for copying an item's cloud url/item link to clipboard. allows you to access the record editor on any inventory item" # max 250 characters
websiteUrl = "http://github.com/EIA485/NeosGetItemLink"
containsNsfwContent = false

[package.dependencies] 
ResoniteModding-BepisLoader = "1.3.1"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

# Copy the compiled DLL to the plugins folder in mod package
[[build.copy]]
source = "GetItemLink/bin/Release/net10.0/GetItemLink.dll"
target = "plugins/"

# Include PDB
[[build.copy]]
source = "GetItemLink/bin/Release/net10.0/GetItemLink.pdb"
target = "plugins/"

# include LICENSE file in mod package
[[build.copy]]
source = "license.txt"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = ["resonite"]

[publish.categories]
resonite = [ "mods" ] # https://thunderstore.io/api/experimental/community/resonite/category/